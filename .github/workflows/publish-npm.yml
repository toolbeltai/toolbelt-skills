name: Publish to npm

# Fires on annotated tag push (e.g. v0.1.0). Publishes @toolbeltai/skills
# as a PUBLIC npm package from this (currently private) source repo.
#
# This workflow is the ONLY thing that talks to public package registries
# in dev stage. The sibling `publish.yml` (ClawHub + Smithery) fires on
# release:published — tags alone do NOT trigger it. That keeps ClawHub
# publishing dormant until leadership approves a formal release.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance

    steps:
      - uses: actions/checkout@v4

      # Node 24 ships with npm >= 11, which is required for Trusted
      # Publishing + provenance. Don't try to self-upgrade npm on older
      # Node versions — the in-place upgrade breaks on GH runners.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Show npm version (must be >= 11.5.1)
        run: npm --version

      - name: Verify package.json version matches tag
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match tag ($TAG)"
            exit 1
          fi

      # Trusted Publishing — npm authenticates via GitHub Actions' OIDC token.
      # The `id-token: write` permission above is what makes this work.
      # No NPM_TOKEN secret required, no 2FA interaction in CI.
      # Requires the org or package to have a Trusted Publisher configured
      # on npmjs.com pointing at this repo + workflow.
      - name: Publish
        run: npm publish --access public --provenance
