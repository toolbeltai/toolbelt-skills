name: Publish to npm

# Fires on push to main when package.json's version field has changed vs
# the previous commit. Auto-publishes @toolbeltai/skills via OIDC
# (Trusted Publishing — no stored NPM_TOKEN) and auto-tags the commit.
#
# Author workflow:
#   1. Bump version in package.json (in a PR or direct commit)
#   2. Merge to main → workflow publishes + tags
#   3. Done. No manual  npm publish  or  git tag  step.
#
# Matches the pattern used by @toolbeltai/cli in the toolbelt monorepo.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bin/**'
      - '**/SKILL.md'
      - '.github/workflows/publish-npm.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tag push requires write
      id-token: write   # OIDC for npm trusted publishing (+ provenance)
      actions: write    # dispatch publish.yml — release events from
                        # GITHUB_TOKEN don't trigger downstream workflows,
                        # so we explicitly dispatch via gh workflow run

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need previous commit to diff versions

      # Node 24 ships with npm >= 11 natively (required for Trusted
      # Publishing). Do NOT try to self-upgrade npm on older Node
      # versions — the in-place upgrade breaks on GH runners.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version bumped
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | node -e "try { let d=''; process.stdin.on('data', c=>d+=c).on('end', ()=>console.log(JSON.parse(d).version)); } catch { console.log(''); }" || echo "")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$PREVIOUS" ] && [ -n "$CURRENT" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "→ version changed: $PREVIOUS → $CURRENT"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "→ version unchanged ($CURRENT). Skipping publish."
          fi

      # OIDC trusted publishing — no stored token. --provenance attaches
      # a verifiable build attestation that npm shows on the package page.
      - name: Publish
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public --provenance

      - name: Tag commit
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.current }}" -m "Published @toolbeltai/skills v${{ steps.version.outputs.current }}"
          git push origin "v${{ steps.version.outputs.current }}"

      # Dispatch publish.yml (ClawHub + Smithery). publish.yml gates each
      # registry step on its token secret, so it runs green as a no-op
      # until CLAWHUB_TOKEN / SMITHERY_TOKEN are added to repo secrets.
      - name: Dispatch downstream publish (ClawHub + Smithery)
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml -f VERSION="v${{ steps.version.outputs.current }}"
