name: Regenerate Demo GIFs

on:
  push:
    paths:
      - "assets/demos/*.sh"
      - "*.tape"
  workflow_dispatch:

jobs:
  gifs:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install ffmpeg and ttyd
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg unzip
          curl -fL "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64" -o /tmp/ttyd
          sudo install /tmp/ttyd /usr/local/bin/ttyd

      - name: Install JetBrainsMono font
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fL "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/JetBrainsMono.zip" -o /tmp/JetBrainsMono.zip
          unzip -o -q /tmp/JetBrainsMono.zip -d ~/.local/share/fonts/
          fc-cache -fv

      - name: Install vhs
        run: go install github.com/charmbracelet/vhs@latest

      - name: Generate GIFs
        run: ~/go/bin/vhs run-toolbelt-demo.tape && ~/go/bin/vhs geo-analyst-demo.tape

      - uses: stefanzweifel/git-auto-commit-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "chore: regenerate demo GIFs [skip ci]"
          commit_user_name: vhs-action
          commit_user_email: actions@github.com
          commit_author: vhs-action <actions@github.com>
          file_pattern: "assets/*.gif"
