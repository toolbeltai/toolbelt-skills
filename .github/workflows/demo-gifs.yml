name: Regenerate Demo GIFs

on:
  push:
    # Branch pushes only — tag pushes check out a detached HEAD which
    # breaks the auto-commit step (git-auto-commit-action can't push
    # to a nameless ref). Release tags (v*.*.*) are handled by
    # publish-npm.yml; gif regen is a branch-time concern.
    branches: [main]
    paths:
      - "assets/demos/*.sh"
      - "*.tape"
  workflow_dispatch:

jobs:
  gifs:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install ffmpeg and ttyd
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg unzip
          curl -fL "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64" -o /tmp/ttyd
          sudo install /tmp/ttyd /usr/bin/ttyd

      - name: Install JetBrainsMono font
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fL "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/JetBrainsMono.zip" -o /tmp/JetBrainsMono.zip
          unzip -o -q /tmp/JetBrainsMono.zip -d ~/.local/share/fonts/
          fc-cache -fv

      - name: Install vhs
        run: go install github.com/charmbracelet/vhs@latest

      - name: Install skill scripts
        run: |
          sudo cp assets/demos/run-toolbelt-demo.sh /run-toolbelt
          sudo cp assets/demos/geo-analyst-demo.sh /geo-analyst
          sudo chmod +x /run-toolbelt /geo-analyst
          sudo mkdir -p /usr/local/fake-bin
          sudo cp assets/demos/fake-curl.sh /usr/local/fake-bin/curl
          sudo chmod +x /usr/local/fake-bin/curl

      - name: Generate GIFs
        run: ~/go/bin/vhs run-toolbelt-demo.tape && ~/go/bin/vhs geo-analyst-demo.tape && PATH=/usr/local/fake-bin:$PATH ~/go/bin/vhs signup.tape

      - uses: stefanzweifel/git-auto-commit-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "chore: regenerate demo GIFs [skip ci]"
          commit_user_name: vhs-action
          commit_user_email: actions@github.com
          commit_author: vhs-action <actions@github.com>
          file_pattern: "assets/*.gif"
