name: Regenerate Demo GIFs

on:
  push:
    paths:
      - "assets/demos/*.sh"
      - "*.tape"
  workflow_dispatch:

jobs:
  gifs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install ffmpeg and ttyd
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ttyd

      - name: Install vhs
        run: go install github.com/charmbracelet/vhs@latest

      - name: Generate GIFs
        run: ~/go/bin/vhs run-toolbelt-demo.tape && ~/go/bin/vhs geo-analyst-demo.tape

      - uses: stefanzweifel/git-auto-commit-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "chore: regenerate demo GIFs [skip ci]"
          commit_user_name: vhs-action
          commit_user_email: actions@github.com
          commit_author: vhs-action <actions@github.com>
          file_pattern: "assets/*.gif"
