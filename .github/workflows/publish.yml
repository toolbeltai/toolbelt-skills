name: Publish Skills

# Publishes skills to ClawHub (OpenClaw's registry) and registers the
# Toolbelt MCP server with Smithery (smithery.ai).
#
# Triggers:
#   1. `release: published`  — human cuts a GitHub Release (manual or via gh release create with a PAT)
#   2. `workflow_dispatch`   — called by publish-npm.yml after a successful npm publish,
#                              since GITHUB_TOKEN-created releases don't fire downstream workflows
#
# Safety:
#   - Each publish step is gated on the presence of its required secret.
#     If CLAWHUB_TOKEN isn't set, the ClawHub step is SKIPPED (not errored).
#     Same for SMITHERY_TOKEN. The workflow will run green on the first
#     trigger with no tokens, and the summary will say "skipped (no token)".
#   - Add the secrets in repo Settings → Secrets and variables → Actions
#     when ready to go live on each registry.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Version tag to publish (e.g., v0.1.3)"
        required: true

jobs:
  # ── MCP Official Registry ──────────────────────────────────────────
  # Publishes server.json to registry.modelcontextprotocol.io under the
  # io.github.toolbeltai/* namespace. Auth is GitHub OIDC — no secret
  # needed; namespace ownership is proven by running in the toolbeltai
  # org. Separate job so a registry hiccup never blocks ClawHub/Smithery.
  mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for mcp-publisher login github-oidc
      contents: read
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.VERSION }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.VERSION }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for registry tokens
        id: gate
        run: |
          echo "has_clawhub=${{ secrets.CLAWHUB_TOKEN != '' }}" >> $GITHUB_OUTPUT
          echo "has_smithery=${{ secrets.SMITHERY_TOKEN != '' }}" >> $GITHUB_OUTPUT

      # ── ClawHub ──────────────────────────────────────────────────────
      - name: Install clawhub CLI
        if: steps.gate.outputs.has_clawhub == 'true'
        # Pinned: unpinned latest broke this workflow when 0.23.x removed
        # the --clawscan-note flag (usage dump + exit 1). Bump deliberately.
        run: npm install -g clawhub@0.23.1

      # Non-interactive auth — stores token to clawhub's config so the
      # subsequent `publish` calls find it. The CLI does NOT read
      # CLAWHUB_TOKEN from env (verified live: first run after wiring the
      # secret failed every skill with "Not logged in. Run: clawhub login").
      - name: Login to ClawHub
        if: steps.gate.outputs.has_clawhub == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-browser

      - name: Publish skills to ClawHub
        if: steps.gate.outputs.has_clawhub == 'true'
        run: |
          failed=0
          for dir in */; do
            dir="${dir%/}"
            if [ -f "$dir/SKILL.md" ]; then
              # Each skill's version is independent of the npm package
              # version — see RELEASING.md "Versioning". Read the top-level
              # `version:` from this skill's SKILL.md and pass it explicitly.
              # clawhub publish auto-detects a version otherwise and rejects
              # anything that doesn't parse as full semver.
              SKILL_VER=$(awk '/^version: /{gsub(/"/, "", $2); print $2; exit}' "$dir/SKILL.md")
              [ -z "$SKILL_VER" ] && SKILL_VER="1.0.0"
              echo "Publishing $dir (version $SKILL_VER)..."
              outfile=$(mktemp)
              # bash -eo pipefail is the default GH Actions shell; the
              # `if (subshell); then` form is the only pattern that
              # cleanly captures both the exit code AND the output of a
              # failing command without tripping errexit.
              # NOTE: --clawscan-note was removed from the clawhub CLI in 0.23.x.
              # The consent/security context lives in SKILL.md itself now; pass a
              # plain changelog line instead.
              if (cd "$dir" && clawhub publish --owner toolbeltai --version "$SKILL_VER" --changelog "See https://github.com/toolbeltai/toolbelt-skills/commits/main" . >"$outfile" 2>&1); then
                echo "✓ $dir published to ClawHub"
              elif grep -q "Version already exists" "$outfile"; then
                echo "= $dir already at $SKILL_VER (no-op)"
              else
                echo "✗ $dir failed on ClawHub"
                cat "$outfile"
                failed=1
              fi
              rm -f "$outfile"
            fi
          done
          exit $failed

      # ── Smithery (MCP server registry — indexes mcp.toolbelt.ai) ─────
      - name: Install Smithery CLI
        if: steps.gate.outputs.has_smithery == 'true'
        # Pinned for the same reason as clawhub: registry CLIs change flags
        # between releases. Bump deliberately.
        run: npm install -g @smithery/cli@4.11.1

      - name: Publish MCP server to Smithery
        if: steps.gate.outputs.has_smithery == 'true'
        env:
          # Smithery CLI reads SMITHERY_API_KEY, not SMITHERY_TOKEN
          # (verified live: without this rename the CLI prompts
          # interactively and the workflow hangs). The repo secret name
          # stays SMITHERY_TOKEN so we don't have to rotate it.
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_TOKEN }}
        run: smithery mcp publish "https://mcp.toolbelt.ai/mcp" -n toolbeltai/toolbelt

      # ── Summary ──────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## Publish results for ${{ steps.v.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.gate.outputs.has_clawhub }}" = "true" ]; then
            echo "- **ClawHub**: published" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **ClawHub**: skipped (CLAWHUB_TOKEN not set)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.gate.outputs.has_smithery }}" = "true" ]; then
            echo "- **Smithery**: published" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Smithery**: skipped (SMITHERY_TOKEN not set)" >> $GITHUB_STEP_SUMMARY
          fi
